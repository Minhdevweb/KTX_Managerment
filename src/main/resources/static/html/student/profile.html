<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Thông tin cá nhân - KTX</title>
    <link
            rel="stylesheet"
            href="/css/style.css">

    <link
            rel="stylesheet"
            href="/css/student/profile.css">

</head>
<body data-require-login="true">

<header class="header">

    <div class="header-top">

        <div class="logo-area">

            <img
                    class="logo"
                    src="/images/logo-vku.jpg"
                    alt="Logo VKU">

            <div class="school-info">

                <h1>
                    TRƯỜNG ĐẠI HỌC CÔNG NGHỆ THÔNG TIN
                </h1>

                <h2>
                    VÀ TRUYỀN THÔNG VIỆT - HÀN
                </h2>

                <p>
                    HỆ THỐNG QUẢN LÝ KÝ TÚC XÁ
                </p>
            </div>
        </div>
    </div>


    <nav class="navbar">

        <div class="nav-container">

            <a
                    href="/html/index.html"
                    class="nav-item">
                TRANG CHỦ
            </a>

            <a
                    href="/html/student/dashboard.html"
                    class="nav-item">
                SINH VIÊN
            </a>

            <div class="auth-area">

                <div class="user-menu">

                    <span
                            class="welcome-user"
                            id="welcomeUser">
                    </span>

                    <button
                            onclick="logout(false)"
                            class="logout-button">
                        ĐĂNG XUẤT
                    </button>
                </div>
            </div>
        </div>
    </nav>
</header>


<main class="profile-page">

    <div class="profile-card">

        <h2 class="profile-title">
            THÔNG TIN CÁ NHÂN
        </h2>


        <div
                id="profileMessage"
                class="profile-message">
        </div>


        <form id="profileForm">

            <div class="profile-grid">

                <!-- HỌ TÊN -->

                <div class="profile-field">

                    <label for="name">
                        Họ và tên
                    </label>

                    <input
                            type="text"
                            id="name"
                            name="name"
                            required>

                </div>

                <!-- USERNAME -->

                <div class="profile-field">

                    <label for="username">
                        Tên đăng nhập
                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            required>
                </div>


                <!-- EMAIL -->

                <div class="profile-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            required>

                </div>


                <!-- PHONE -->

                <div class="profile-field">

                    <label for="numberPhone">
                        Số điện thoại
                    </label>

                    <input
                            type="text"
                            id="numberPhone"
                            name="numberPhone">

                </div>


                <!-- ROLE -->

                <div class="profile-field">

                    <label for="role">
                        Vai trò
                    </label>

                    <input
                            type="text"
                            id="role"
                            readonly
                            class="readonly-field">
                </div>

                <!-- ID -->

                <div class="profile-field">

                    <label for="userId">
                        Mã người dùng
                    </label>

                    <input
                            type="text"
                            id="userId"
                            readonly
                            class="readonly-field">

                </div>
            </div>


            <div class="profile-actions">

                <button
                        type="submit"
                        id="saveButton"
                        class="save-button">

                    LƯU THAY ĐỔI

                </button>


                <a
                        href="/html/student/dashboard.html"
                        class="back-button">

                    QUAY LẠI

                </a>
            </div>
        </form>
    </div>
</main>


<footer class="footer">

    <p>
        © 2026 Trường Đại học Công nghệ Thông tin và Truyền thông Việt - Hàn
    </p>

    <p>
        Hệ thống quản lý ký túc xá
    </p>

</footer>


<script src="/js/auth.js"></script>
<script src="/js/student/profile.js"></script>

</body>

</html>
